services:
  deepaicode2api:
    build:
      context: .
      target: browser
    environment:
      DEEPAI_GOOGLE_HEADLESS: ${DEEPAI_GOOGLE_HEADLESS:-false}
      DEEPAI_GOOGLE_IDLE_TIMEOUT: ${DEEPAI_GOOGLE_IDLE_TIMEOUT:-60s}
      DEEPAI_GOOGLE_BROWSER: /usr/bin/chromium-browser
      DEEPAI_GOOGLE_PROXY: ${DEEPAI_GOOGLE_PROXY:-}
    shm_size: "256mb"
